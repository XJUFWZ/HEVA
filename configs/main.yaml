experiment:
  name: HEVA
  seeds: [1, 2, 3, 4, 42]
  output_dir: outputs
runtime:
  backend: cuda
  frozen_config: configs/frozen.yaml
protocol:
  validation_fraction: 0.2
model:
  backbone_trainable: false
  valence:
    base_alpha: 1.0
    semantic_alpha: 1.0
    final_alpha: 1.0
    fusion_weight: 0.5
    context_radius: 8
    oof_splits: 5
  arousal:
    top_k: 8
    fusion_weight: 0.5
    context_radius: 8
    temporal_alpha: 0.01
    oof_splits: 5
datasets:
  deam:
    grouping: track
    expected:
      train_tracks: 1744
      train_points: 104640
      test_tracks: 58
      test_points: 25355
    paths:
      global_features: ${HEVA_DATA_ROOT}/deam/global
      head_features: ${HEVA_DATA_ROOT}/deam/heads
      acoustic_train: ${HEVA_DATA_ROOT}/deam/acoustic_train.npz
      acoustic_test: ${HEVA_DATA_ROOT}/deam/acoustic_test.npz
      semantic_train:
        - ${HEVA_DATA_ROOT}/deam/semantic_train/part00
        - ${HEVA_DATA_ROOT}/deam/semantic_train/part01
        - ${HEVA_DATA_ROOT}/deam/semantic_train/part02
        - ${HEVA_DATA_ROOT}/deam/semantic_train/part03
        - ${HEVA_DATA_ROOT}/deam/semantic_train/part04
        - ${HEVA_DATA_ROOT}/deam/semantic_train/part05
        - ${HEVA_DATA_ROOT}/deam/semantic_train/part06
        - ${HEVA_DATA_ROOT}/deam/semantic_train/part07
        - ${HEVA_DATA_ROOT}/deam/semantic_train/part08
        - ${HEVA_DATA_ROOT}/deam/semantic_train/part09
      semantic_test:
        - ${HEVA_DATA_ROOT}/deam/semantic_test
  pmemo:
    grouping: audio_sha256
    expected:
      train_tracks: 632
      train_content_groups: 626
      train_points: 30690
      test_tracks: 40
      test_content_groups: 40
      test_points: 4656
    paths:
      manifest: ${HEVA_DATA_ROOT}/pmemo/manifest.csv
      global_features: ${HEVA_DATA_ROOT}/pmemo/global
      head_features: ${HEVA_DATA_ROOT}/pmemo/heads
      acoustic_train: ${HEVA_DATA_ROOT}/pmemo/acoustic_train.npz
      acoustic_test: ${HEVA_DATA_ROOT}/pmemo/acoustic_test.npz
      semantic_train:
        - ${HEVA_DATA_ROOT}/pmemo/semantic_train
      semantic_test:
        - ${HEVA_DATA_ROOT}/pmemo/semantic_test
